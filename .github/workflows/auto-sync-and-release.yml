name: Auto Sync and Release

# 本家 upstream の更新を日次検出し、決定論的に解決できる範囲は自動マージする。
# - merged:        push → release-fork 起動 → Issue 自動クローズ
# - needs_agent:   upstream-sync Issue を作成（Devin Automation がワーカーへ転送）
# - already_synced: 何もしない
#
# 解決ルールは scripts/Resolve-UpstreamSync.ps1 + scripts/Apply-ForkIdentity.ps1。
# .github/workflows/ の upstream 変更は GITHUB_TOKEN では push できないため
# 常に needs_agent (Devin ワーカーが push) になる点に注意。

on:
  schedule:
    # 毎日午前9時（日本時間）に実行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (detect and classify only, no push/issue)'
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream-sync-completed]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    name: Detect Upstream and Resolve Merge
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.sync_result.outputs.result }}
      conflict_files: ${{ steps.sync_result.outputs.conflict_files }}
      review_files: ${{ steps.sync_result.outputs.review_files }}
      readme_changed: ${{ steps.sync_result.outputs.readme_changed }}
      docs_to_review: ${{ steps.sync_result.outputs.docs_to_review }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      has_new_version: ${{ steps.check_new_version.outputs.has_new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ja-localization

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sbroenne/mcp-server-excel.git
          git fetch upstream main

      - name: Get upstream version
        id: version
        run: |
          echo "Fetching upstream tags..."
          git fetch upstream --tags 2>/dev/null || echo "Note: Some tags skipped due to conflicts (this is OK)"
          LATEST_TAG=$(git ls-remote --tags upstream 'v*' 2>/dev/null | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+$' | sort -V | tail -1)
          echo "Latest upstream tag (from ls-remote): $LATEST_TAG"
          if [ -z "$LATEST_TAG" ]; then
            echo "ls-remote failed, trying local tags..."
            LATEST_TAG=$(git tag --list 'v*' 2>/dev/null | grep '^v[0-9]\+\.[0-9]\+\.[0-9]\+$' | sort -V | tail -1)
            echo "Latest local tag: $LATEST_TAG"
          fi
          VERSION="${LATEST_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "" ]; then
            BUILD_PROPS=$(git show upstream/main:Directory.Build.props 2>/dev/null)
            if [ -n "$BUILD_PROPS" ]; then
              VERSION=$(echo "$BUILD_PROPS" | grep '<Version>' | head -1 | sed 's/.*<Version>//' | sed 's/<\/Version>.*//' | tr -d '[:space:]')
              echo "Version from Directory.Build.props: $VERSION"
            fi
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "" ]; then
            VERSION="unknown"
            echo "WARNING: Could not determine version, using 'unknown'"
          fi
          echo "upstream_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if upstream has new version
        id: check_new_version
        run: |
          git fetch origin --tags 2>/dev/null || echo "Note: Some tags skipped due to conflicts (this is OK)"
          LATEST_FORK_TAG=$(git ls-remote --tags origin 'v*' 2>/dev/null | grep -o 'v[0-9]\+\.[0-9]\+\.[0-9]\+-ja\.[0-9]\+$' | sort -V | tail -1)
          echo "Latest fork tag: $LATEST_FORK_TAG"
          FORK_BASE_VERSION=""
          if [ -n "$LATEST_FORK_TAG" ]; then
            FORK_BASE_VERSION=$(echo "$LATEST_FORK_TAG" | sed 's/v\([0-9]\+\.[0-9]\+\.[0-9]\+\)-ja\.[0-9]\+/\1/')
            echo "Fork base version: $FORK_BASE_VERSION"
          else
            echo "No fork tags found, will build"
          fi
          UPSTREAM_VERSION="${{ steps.version.outputs.upstream_version }}"
          if [ "$FORK_BASE_VERSION" = "$UPSTREAM_VERSION" ]; then
            echo "Upstream version $UPSTREAM_VERSION already built in fork"
            echo "has_new_version=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version $UPSTREAM_VERSION detected"
            echo "has_new_version=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve upstream merge
        id: sync_result
        if: steps.check_new_version.outputs.has_new_version == 'true'
        shell: pwsh
        run: pwsh -File scripts/Resolve-UpstreamSync.ps1 -Ref upstream/main

      - name: Mark already synced
        id: already
        if: steps.check_new_version.outputs.has_new_version != 'true'
        run: |
          echo "result=already_synced" >> $GITHUB_OUTPUT
          echo "conflict_files=" >> $GITHUB_OUTPUT
          echo "review_files=" >> $GITHUB_OUTPUT
          echo "readme_changed=false" >> $GITHUB_OUTPUT
          echo "docs_to_review=" >> $GITHUB_OUTPUT

      - name: Record upstream version and push
        if: steps.sync_result.outputs.result == 'merged' && github.event.inputs.dry_run != 'true'
        run: |
          echo "${{ steps.version.outputs.upstream_version }}" > .upstream-version
          git add .upstream-version
          git commit -m "chore: record upstream version ${{ steps.version.outputs.upstream_version }}" || echo "No changes to commit"
          git push origin ja-localization
          echo "✅ Pushed merged ja-localization"

  # needs_agent または日本語資産レビューが必要な場合は Issue を作成。
  # sync ジョブが失敗しても通知を必ず試みる (always())。
  create-issue:
    name: Create upstream-sync Issue
    needs: sync
    if: >
      always() && github.event.inputs.dry_run != 'true' &&
      (needs.sync.result == 'failure' ||
       needs.sync.outputs.result == 'needs_agent' ||
       (needs.sync.outputs.result == 'merged' && needs.sync.outputs.docs_to_review != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.sync.outputs.result }}';
            const jobFailed = '${{ needs.sync.result }}' === 'failure';
            const conflictFiles = '${{ needs.sync.outputs.conflict_files }}';
            const reviewFiles = '${{ needs.sync.outputs.review_files }}';
            const docsToReview = '${{ needs.sync.outputs.docs_to_review }}';
            const upstreamVersion = '${{ needs.sync.outputs.upstream_version }}';
            const readmeChanged = '${{ needs.sync.outputs.readme_changed }}';

            const list = s => s ? s.split(',').map(f => `- \`${f.trim()}\``).join('\n') : '（なし）';
            const sections = [];
            if (jobFailed) {
              sections.push('## ⚠️ sync ジョブが失敗しました\n\nActions ログを確認し、原因に応じてワーカーへ引き継いでください。');
            }
            if (conflictFiles) {
              sections.push(`### 未解決の競合 / 要エージェント作業\n${list(conflictFiles)}\n\nワーカー手順:\n1. \`git fetch upstream && git merge upstream/main --no-commit --no-ff\` の代わりに \`pwsh scripts/Resolve-UpstreamSync.ps1 -Ref upstream/main -KeepMerge\` を実行するとクラス A/B が自動解決されます。\n2. 残った競合を AGENTS.md 「日本語対応フォーク固有ルール」に従って解決。\n3. \`git add -A && git commit\` 後、検証して \`ja-localization\` へ push。\n\n※ \`.github/workflows/\` の変更は GITHUB_TOKEN で push 不可のため常にワーカー対応です。`);
            }
            if (docsToReview) {
              sections.push(`### upstream 更新のあった日本語資産（翻訳・差分確認が必要）\n${list(docsToReview)}\n\nREADME.md 変更: ${readmeChanged}\n基準スナップショット: \`docs/UPSTREAM-README-EN.md\`（merge 時に更新済み）と前回コミット版の差分が翻訳対象です。`);
            }
            if (reviewFiles) {
              sections.push(`### 自動解決済み（確認用）\n${list(reviewFiles)}`);
            }
            sections.push('cc: @matsuzaki-hk');
            const body = `## Upstream sync (v${upstreamVersion})\n\n**検出時刻:** ${new Date().toISOString()}\n**結果:** ${jobFailed ? 'sync job failed' : result}\n\n` + sections.join('\n\n');

            // 重複Issue防止: 既存オープン upstream-sync Issue に追記する
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 100
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `### 再検出 (${new Date().toISOString()})\n${body}`
              });
              console.log(`Updated existing issue #${issue.number}`);
              return;
            }

            const labels = ['upstream-sync'];
            if (jobFailed || result === 'needs_agent') labels.push('conflict', 'help wanted');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Upstream sync ${jobFailed ? 'failed' : 'needs attention'} (v${upstreamVersion})`,
              body: body,
              labels: labels
            });
            console.log('Created upstream-sync issue');

  trigger-release:
    name: Trigger Release Build
    needs: sync
    if: needs.sync.outputs.result == 'merged' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Release Fork workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-fork.yml',
              ref: 'ja-localization',
              inputs: { version_bump: 'patch' }
            });
            console.log(`✅ Release triggered for upstream version: ${{ needs.sync.outputs.upstream_version }}`);

  notify-success:
    name: Close Resolved Sync Issues
    needs: [sync, trigger-release]
    if: needs.sync.outputs.result == 'merged' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on and close open sync issues
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamVersion = '${{ needs.sync.outputs.upstream_version }}';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Resolved!** Auto-sync completed for v${upstreamVersion}. Release build triggered.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
