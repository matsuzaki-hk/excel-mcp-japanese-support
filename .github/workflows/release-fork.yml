name: Release Fork (GitHub Only)

# Fork-specific release workflow - creates GitHub release only
# Skips NuGet, VS Code Marketplace, and MCP Registry publishing
# This is for the Japanese support fork

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - major
          - minor
          - patch
      custom_version:
        description: 'Custom version (e.g., 1.0.0-ja.1, overrides version_bump)'
        required: false
        type: string
  workflow_run:
    workflows: ["Sync with Upstream"]
    types: [completed]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # Calculate Version
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.calculate_version.outputs.version }}
      tag: ${{ steps.calculate_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ja-localization

      - name: Calculate version
        id: calculate_version
        run: |
          # workflow_runトリガーの場合は.upstream-versionから読み取る
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ -f ".upstream-version" ]; then
              UPSTREAM_VERSION=$(cat .upstream-version)
              VERSION="${UPSTREAM_VERSION}-ja.1"
              echo "Using upstream version: ${UPSTREAM_VERSION}"
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
              exit 0
            else
              echo ".upstream-version file not found, using latest tag"
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
              CURRENT_VERSION="${LATEST_TAG#v}"
              VERSION="${CURRENT_VERSION}"
            fi
          elif [ -n "${{ inputs.custom_version }}" ]; then
            VERSION="${{ inputs.custom_version }}"
            # バージョンが無効な場合（unknownなど）はフォールバック
            if [[ "$VERSION" == *"unknown"* ]] || [[ "$VERSION" == "" ]]; then
              echo "Invalid version received: ${VERSION}"
              echo "Falling back to latest tag calculation"
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
              CURRENT_VERSION="${LATEST_TAG#v}"
              VERSION="${CURRENT_VERSION}"
            fi
            echo "Using custom version: ${VERSION}"
          else
            # Get upstream version and append auto-incremented -ja.X suffix
            git remote add upstream https://github.com/sbroenne/mcp-server-excel.git 2>/dev/null || true
            git fetch upstream --tags 2>/dev/null || true
            
            UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "")
            
            if [ -n "$UPSTREAM_TAG" ]; then
              UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
              echo "Latest upstream version: ${UPSTREAM_VERSION}"
              BASE_VERSION="$UPSTREAM_VERSION"
              
              # Find highest existing -ja.X suffix for this base version
              LATEST_JA=$(git tag --list "v${BASE_VERSION}-ja.*" | sort -V | tail -1)
              if [ -n "$LATEST_JA" ]; then
                JA_NUM=$(echo "$LATEST_JA" | sed -E 's/.*-ja\.([0-9]+)$/\1/')
                JA_NUM=$((JA_NUM + 1))
              else
                JA_NUM=1
              fi
              
              VERSION="${BASE_VERSION}-ja.${JA_NUM}"
              echo "New fork version: ${VERSION}"
            else
              # Fallback to latest local tag bump
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
              echo "Latest tag: ${LATEST_TAG}"
              CURRENT_VERSION="${LATEST_TAG#v}"
              echo "Current version: ${CURRENT_VERSION}"
              
              if [[ "$CURRENT_VERSION" == *"-ja"* ]]; then
                BASE_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-ja\.[0-9]\+$//')
                echo "Base version: ${BASE_VERSION}"
                CURRENT_VERSION="${BASE_VERSION}"
              fi
              
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
              case "${{ inputs.version_bump }}" in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                patch)
                  PATCH=$((PATCH + 1))
                  ;;
              esac
              VERSION="${MAJOR}.${MINOR}.${PATCH}-ja.1"
              echo "New version: ${VERSION}"
            fi
          fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # Build MCP Server
  build-mcp-server:
    name: MCP Server
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ja-localization

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        $numericVersion = $version -replace '^v','' -replace '-.*$',''
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "NUMERIC_VERSION=$numericVersion" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Update Project Versions
      run: |
        $version = $env:VERSION
        $serverJsonPath = "src/ExcelMcp.McpServer/.mcp/server.json"
        $serverContent = Get-Content $serverJsonPath -Raw
        $serverContent = $serverContent -replace '("version":\s*)"[\d\.]+"(\s*,\s*\n\s*"packages")' , "`$1`"$version`"`$2"
        $serverContent = $serverContent -replace '("identifier":\s*"Sbroenne\.ExcelMcp\.McpServer",\s*\n\s*"version":\s*)"[\d\.]+"', "`$1`"$version`"" 
        Set-Content $serverJsonPath $serverContent
      shell: pwsh

    - name: Clean All Objects
      run: |
        Get-ChildItem -Path . -Directory -Filter "obj" -Recurse | Remove-Item -Recurse -Force
        Get-ChildItem -Path . -Directory -Filter "bin" -Recurse | Remove-Item -Recurse -Force
      shell: pwsh

    - name: Restore
      run: dotnet restore src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj --no-cache --runtime win-x64 -p:Version=$env:NUMERIC_VERSION.0 -p:NoWarn=NU1902
      shell: pwsh

    - name: Clean
      run: dotnet clean src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj --configuration Release

    - name: Build
      run: |
        $asmVer = "$env:NUMERIC_VERSION.0"
        dotnet build src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj --configuration Release --no-restore --no-incremental -p:Version=$env:VERSION -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer
      shell: pwsh
      env:
        APPINSIGHTS_CONNECTION_STRING: ""

    - name: Publish MCP Server
      run: |
        $asmVer = "$env:NUMERIC_VERSION.0"
        dotnet publish src/ExcelMcp.McpServer/ExcelMcp.McpServer.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --no-restore `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:Version=$env:VERSION `
          -p:AssemblyVersion=$asmVer `
          -p:FileVersion=$asmVer `
          -p:NuGetAudit=false `
          --output ./mcp-server-publish
      shell: pwsh
      env:
        APPINSIGHTS_CONNECTION_STRING: ""

    - name: Rename exe to mcp-excel.exe
      run: |
        $expectedExe = "mcp-server-publish/Sbroenne.ExcelMcp.McpServer.exe"
        if (Test-Path $expectedExe) {
          Rename-Item $expectedExe "mcp-excel.exe"
        } else {
          Write-Error "Expected executable not found at: $expectedExe"
          Write-Host "Contents of mcp-server-publish/:"
          Get-ChildItem "mcp-server-publish/" | Select-Object Name
          exit 1
        }
      shell: pwsh

    - name: Create Release Package
      run: |
        $version = $env:VERSION
        New-Item -ItemType Directory -Path "mcp-server-release" -Force
        Copy-Item "mcp-server-publish/mcp-excel.exe" "mcp-server-release/"
        Copy-Item "README.md" "mcp-server-release/"
        Copy-Item "LICENSE" "mcp-server-release/"
        Compress-Archive -Path "mcp-server-release/*" -DestinationPath "ExcelMcp-MCP-Server-$version-windows.zip"
      shell: pwsh

    - name: Upload ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcp-server-zip
        path: ExcelMcp-MCP-Server-*-windows.zip

  # Build CLI
  build-cli:
    name: CLI
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ja-localization

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set Version
      run: |
        $version = "${{ needs.version.outputs.version }}"
        $numericVersion = $version -replace '^v','' -replace '-.*$',''
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "NUMERIC_VERSION=$numericVersion" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Clean All Objects CLI
      run: |
        Get-ChildItem -Path . -Directory -Filter "obj" -Recurse | Remove-Item -Recurse -Force
        Get-ChildItem -Path . -Directory -Filter "bin" -Recurse | Remove-Item -Recurse -Force
      shell: pwsh

    - name: Restore
      run: dotnet restore src/ExcelMcp.CLI/ExcelMcp.CLI.csproj --no-cache --runtime win-x64 -p:Version=$env:NUMERIC_VERSION.0 -p:NoWarn=NU1902
      shell: pwsh

    - name: Clean CLI
      run: dotnet clean src/ExcelMcp.CLI/ExcelMcp.CLI.csproj --configuration Release

    - name: Build CLI
      run: |
        $asmVer = "$env:NUMERIC_VERSION.0"
        dotnet build src/ExcelMcp.CLI/ExcelMcp.CLI.csproj --configuration Release --no-restore --no-incremental -p:Version=$env:VERSION -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer
      shell: pwsh

    - name: Publish CLI
      run: |
        $asmVer = "$env:NUMERIC_VERSION.0"
        dotnet publish src/ExcelMcp.CLI/ExcelMcp.CLI.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --no-restore `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:PublishReadyToRun=false `
          -p:Version=$env:VERSION `
          -p:AssemblyVersion=$asmVer `
          -p:FileVersion=$asmVer `
          -p:NuGetAudit=false `
          --output ./cli-publish
      shell: pwsh

    - name: Create CLI ZIP
      run: |
        $version = $env:VERSION
        New-Item -ItemType Directory -Path "cli-release" -Force
        Copy-Item "cli-publish/excelcli.exe" "cli-release/"
        Copy-Item "README.md" "cli-release/"
        Copy-Item "LICENSE" "cli-release/"
        Compress-Archive -Path "cli-release/*" -DestinationPath "ExcelMcp-CLI-$version-windows.zip"
      shell: pwsh

    - name: Upload CLI ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cli-zip
        path: ExcelMcp-CLI-*-windows.zip

  # Create Git Tag
  create-tag:
    name: Create Git Tag
    needs: [version, build-mcp-server, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ja-localization

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          echo "Creating tag: $TAG"
          # Remove existing local tag if present
          git tag -d "$TAG" 2>/dev/null || true
          git tag -a "$TAG" -m "Release $TAG (Japanese Support Fork)"
          # Remove existing remote tag if present, then push
          git push --delete origin "$TAG" 2>/dev/null || true
          git push origin "$TAG"

  # Cleanup .upstream-version file
  cleanup:
    name: Cleanup .upstream-version
    needs: [create-tag]
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ja-localization

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove .upstream-version file
        run: |
          if [ -f ".upstream-version" ]; then
            git rm .upstream-version
            git commit -m "Remove temporary .upstream-version file"
            git push origin main
          fi

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [version, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ja-localization

    - name: Set Version
      run: |
        echo "VERSION=${{ needs.version.outputs.version }}" >> $GITHUB_ENV

    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Fetch Upstream Release Info
      id: upstream
      uses: actions/github-script@v7
      with:
        script: |
          // Extract upstream version from fork version (e.g., 1.8.67-ja.5 -> 1.8.67)
          const forkVersion = '${{ env.VERSION }}';
          const versionMatch = forkVersion.match(/^(\d+\.\d+\.\d+)/);
          const versionNumber = versionMatch ? versionMatch[1] : '1.8.67';
          
          // Fetch CHANGELOG.md
          const changelogResponse = await github.rest.repos.getContent({
            owner: 'sbroenne',
            repo: 'mcp-server-excel',
            path: 'CHANGELOG.md'
          });
          
          const changelogContent = Buffer.from(changelogResponse.data.content, 'base64').toString('utf-8');
          
          // Extract version-specific changes from CHANGELOG.md
          // Pattern: ## [1.8.67] - YYYY-MM-DD
          const versionPattern = new RegExp(`## \\[${versionNumber}\\] - [\\d-]+`);
          const versionMatchResult = changelogContent.match(versionPattern);
          
          let upstreamBody = 'No release notes available';
          
          if (versionMatchResult) {
            const startIndex = changelogContent.indexOf(versionMatchResult[0]);
            // Find the next version section or end of file
            const nextVersionPattern = /## \[\d+\.\d+\.\d+\] - [\d-]+/;
            const nextVersionMatch = changelogContent.substring(startIndex + versionMatchResult[0].length).match(nextVersionPattern);
            
            let endIndex = changelogContent.length;
            if (nextVersionMatch) {
              endIndex = startIndex + versionMatchResult[0].length + changelogContent.substring(startIndex + versionMatchResult[0].length).indexOf(nextVersionMatch[0]);
            }
            
            upstreamBody = changelogContent.substring(startIndex, endIndex);
          } else {
            // Fallback: try to extract [Unreleased] section
            const unreleasedPattern = /## \[Unreleased\]/;
            const unreleasedMatch = changelogContent.match(unreleasedPattern);
            
            if (unreleasedMatch) {
              const startIndex = changelogContent.indexOf(unreleasedMatch[0]);
              // Find the next version section or end of file
              const nextVersionPattern = /## \[\d+\.\d+\.\d+\] - [\d-]+/;
              const nextVersionMatch = changelogContent.substring(startIndex + unreleasedMatch[0].length).match(nextVersionPattern);
              
              let endIndex = changelogContent.length;
              if (nextVersionMatch) {
                endIndex = startIndex + unreleasedMatch[0].length + changelogContent.substring(startIndex + unreleasedMatch[0].length).indexOf(nextVersionMatch[0]);
              }
              
              upstreamBody = changelogContent.substring(startIndex, endIndex);
            } else {
              // Final fallback: try to get upstream release body
              try {
                const upstreamRelease = await github.rest.repos.getReleaseByTag({
                  owner: 'sbroenne',
                  repo: 'mcp-server-excel',
                  tag: 'v' + versionNumber
                });
                upstreamBody = upstreamRelease.data.body || 'No release notes available';
              } catch (error) {
                upstreamBody = 'No release notes available';
              }
            }
          }
          
          // Extract only the change notes from the upstream body
          let changes = upstreamBody
            .replace(/^##\s+[^\n]+\n+/m, '')
            .replace(/\n###\s+(?:Installation Options|Requirements|Documentation|Links)[\s\S]*$/i, '');

          changes = changes.trim();

          const whatsNewMatch = changes.match(/^###\s+What[\u0027\u2019]?s New\s*\n([\s\S]*?)(?=\n###\s+(?:Installation|Requirements|Documentation|Links)|\n##\s|$)/);
          if (whatsNewMatch) {
            changes = whatsNewMatch[1].trim();
          }

          const placeholderPattern = /^\s*(?:_?No changes recorded.*?|See repository for details\.)\s*$/i;
          const hasChanges = !!(changes && !placeholderPattern.test(changes));

          if (hasChanges && changes.length > 3000) {
            changes = changes.substring(0, 3000) + '\n\n...(truncated)';
          }

          // Base64 encode to safely pass through shell without interpretation
          const base64Body = Buffer.from(upstreamBody).toString('base64');
          const changesB64 = Buffer.from(changes).toString('base64');

          core.setOutput('upstream_version', `v${versionNumber}`);
          core.setOutput('upstream_body_b64', base64Body);
          core.setOutput('has_changes', hasChanges.toString());
          core.setOutput('upstream_changes_b64', changesB64);
          console.log(`Fork version: ${forkVersion}`);
          console.log(`Upstream version: v${versionNumber}`);
          console.log(`Has upstream changes: ${hasChanges}`);
          console.log(`Body length: ${upstreamBody.length}, Base64 length: ${base64Body.length}, Changes length: ${changes.length}`);

    - name: Extract Fork Features from README
      id: readme
      run: |
        # Extract Japanese localization section from README
        FORK_FEATURES=$(cat README.md | sed -n '/### Branch Structure/,/### /p' | head -20 | sed 's/^/  /')
        
        # Extract VBA section if present
        VBA_FEATURES=$(cat README.md | sed -n '/VBA エクスポート\/インポート機能/,/## /p' | head -15 | sed 's/^/  /')
        
        echo "fork_features<<EOF" >> $GITHUB_OUTPUT
        echo "$FORK_FEATURES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "vba_features<<EOF" >> $GITHUB_OUTPUT
        echo "$VBA_FEATURES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      run: |
        VERSION="${{ env.VERSION }}"
        TAG="${{ needs.version.outputs.tag }}"
        UPSTREAM_VER="${{ steps.upstream.outputs.upstream_version }}"
        
        # Decode base64 upstream changes
        UPSTREAM_CHANGES_B64="${{ steps.upstream.outputs.upstream_changes_b64 }}"
        UPSTREAM_CHANGES=$(echo "$UPSTREAM_CHANGES_B64" | base64 -d)
        
        # Write release notes using printf to handle special characters safely
        printf '%s\n' "## ExcelMcp $VERSION (Japanese Support Fork / 日本語対応フォーク)" > release_notes.md
        printf '\n' >> release_notes.md
        printf '%s\n' "🇯🇵 本家 [sbroenne/mcp-server-excel](https://github.com/sbroenne/mcp-server-excel) の日本語対応フォークです。" >> release_notes.md
        printf '\n---\n\n' >> release_notes.md
        if [ "${{ steps.upstream.outputs.has_changes }}" = "true" ] && [ -n "$UPSTREAM_CHANGES" ]; then
          printf '%s\n' "## 本家変更 (Based on $UPSTREAM_VER)" >> release_notes.md
          printf '\n' >> release_notes.md
          printf '%s\n' "$UPSTREAM_CHANGES" >> release_notes.md
          printf '\n---\n\n' >> release_notes.md
        fi
        printf '%s\n' "## FORK固有機能 / 日本語対応機能" >> release_notes.md
        printf '\n' >> release_notes.md
        printf '%s\n' "### 日本語化サポート" >> release_notes.md
        printf '%s\n' "- Excel上の日本語テーブル名・シート名の完全サポート" >> release_notes.md
        printf '%s\n' "- 日本語SKILLファイルによるAI応答の最適化" >> release_notes.md
        printf '%s\n' "- 自動アップストリーム同期（競合検出・解決付き）" >> release_notes.md
        printf '\n' >> release_notes.md
        printf '%s\n' "### VBA エクスポート/インポート機能" >> release_notes.md
        printf '%s\n' "- 標準モジュール・クラスモジュールのエクスポート/インポート" >> release_notes.md
        printf '%s\n' "- UserForm対応（.frm + .frxファイル）" >> release_notes.md
        printf '%s\n' "- 複数モジュール一括処理" >> release_notes.md
        printf '\n' >> release_notes.md
        printf '%s\n' "### その他の改善" >> release_notes.md
        printf '%s\n' "- 日本語環境での動作最適化" >> release_notes.md
        printf '%s\n' "- 詳細は README.md を参照" >> release_notes.md
        printf '\n---\n\n' >> release_notes.md
        printf '%s\n' "## インストール / Installation" >> release_notes.md
        printf '\n' >> release_notes.md
        printf '%s\n' "**MCP Server:** \`ExcelMcp-MCP-Server-$VERSION-windows.zip\` をダウンロードし、\`mcp-excel.exe\` を展開" >> release_notes.md
        printf '%s\n' "**CLI:** \`ExcelMcp-CLI-$VERSION-windows.zip\` をダウンロードし、\`excelcli.exe\` を展開" >> release_notes.md
        printf '\n' >> release_notes.md
        printf '%s\n' "### 動作環境" >> release_notes.md
        printf '%s\n' "- Windows OS" >> release_notes.md
        printf '%s\n' "- Microsoft Excel 2016+" >> release_notes.md
        printf '%s\n' "- .NETランタイム不要（スタンドアロン実行ファイル）" >> release_notes.md
        printf '\n---\n\n' >> release_notes.md
        printf '%s\n' "## 関連リンク" >> release_notes.md
        printf '%s\n' "- [本家プロジェクト (Original Project)](https://github.com/sbroenne/mcp-server-excel)" >> release_notes.md
        printf '%s\n' "- [FORK リポジトリ](https://github.com/matsuzaki-hk/excel-mcp-japanese-support)" >> release_notes.md

        ARTIFACTS=""
        for f in artifacts/mcp-server-zip/*.zip; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done
        for f in artifacts/cli-zip/*.zip; do [ -f "$f" ] && ARTIFACTS="$ARTIFACTS $f"; done

        echo "Creating release with artifacts:$ARTIFACTS"

        gh release create "$TAG" $ARTIFACTS \
          --title "ExcelMcp $VERSION (Japanese Support Fork)" \
          --notes-file release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}